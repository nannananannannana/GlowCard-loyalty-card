<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GlowCard — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--dark-green:#004837;--light-blue:#AEDDFD;
  --light-green:#D8FFDF;--light-yellow:#F8FBC3;--light-pink:#FFE4E1;
  --bright-green:#5FF49A;--bright-pink:#FD7E8B;--black:#00110C;
  --c1:#288167;--c2:#49AB8E;--c3:#7CCEB8;--c4:#2F8FCF;--c5:#5EB5EC;
  --c6:#395F7A;--c7:#5789AC;--c8:#89AEC7;--c9:#5E7480;--c10:#8095A0;--c11:#B5C0C6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans',Arial,sans-serif;background:var(--dark-green);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

.header{width:100%;padding:28px 20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.header .logo{font-size:26px;margin-bottom:2px;}
.header h1{font-size:20px;font-weight:700;}
.header h1 span{color:var(--bright-green);}
.header p{font-size:12px;font-weight:300;opacity:.6;margin-top:3px;}

.main{width:100%;max-width:460px;padding:18px 16px;display:flex;flex-direction:column;gap:16px;}

.mode-tabs{display:flex;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.07);padding:3px;gap:3px;}
.mode-tab{flex:1;padding:11px 6px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--white);font-family:inherit;border-radius:11px;transition:.3s;}
.mode-tab.active{background:var(--bright-green);color:var(--dark-green);}

.panel{display:none;flex-direction:column;gap:14px;}
.panel.active{display:flex;}

#scanner-video{width:100%;border-radius:14px;border:3px solid var(--bright-green);background:#000;aspect-ratio:4/3;object-fit:cover;}
.scan-status{background:rgba(255,255,255,.06);border-radius:14px;padding:18px;text-align:center;}
.scan-status .icon{font-size:40px;margin-bottom:6px;}
.scan-status .msg{font-size:13px;font-weight:500;opacity:.7;}

.manual-card{background:rgba(255,255,255,.05);border-radius:18px;padding:22px 18px;}
.manual-card label{font-size:12px;font-weight:500;opacity:.6;display:block;margin-bottom:6px;}
.manual-card input{width:100%;padding:13px 16px;border:2px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:var(--white);font-family:inherit;font-size:14px;outline:none;margin-bottom:14px;}
.manual-card input::placeholder{color:rgba(255,255,255,.3);}

.found-card{display:none;background:var(--white);border-radius:20px;padding:24px 20px;color:var(--black);text-align:center;}
.found-card.show{display:block;animation:slideUp .35s ease;}
.found-name{font-size:20px;font-weight:700;color:var(--dark-green);}
.found-id{font-size:11px;opacity:.35;margin-top:2px;word-break:break-all;}

.found-visits{display:flex;justify-content:center;gap:20px;margin:16px 0;}
.fv-box{text-align:center;}
.fv-box .num{font-size:30px;font-weight:700;color:var(--dark-green);}
.fv-box .lbl{font-size:11px;font-weight:500;opacity:.45;}

.stamp-row{display:flex;justify-content:center;gap:8px;margin-bottom:16px;}
.mini-stamp{width:44px;height:44px;border-radius:12px;border:2px dashed rgba(0,72,55,.15);display:flex;align-items:center;justify-content:center;font-size:20px;}
.mini-stamp.filled{background:var(--bright-green);border-color:var(--bright-green);}
.mini-stamp.reward-slot{border-color:var(--bright-pink);}
.mini-stamp.filled.reward-slot{background:var(--bright-pink);border-color:var(--bright-pink);}

.chosen-reward{background:var(--light-yellow);border-radius:14px;padding:14px 16px;margin:10px 0;display:flex;align-items:center;gap:12px;text-align:left;}
.chosen-reward .cr-icon{font-size:26px;}
.chosen-reward .cr-title{font-size:14px;font-weight:700;color:var(--dark-green);}
.chosen-reward .cr-desc{font-size:11px;opacity:.55;}

.btn-add{width:100%;padding:14px;border:none;border-radius:30px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.3s;background:var(--bright-green);color:var(--dark-green);}
.btn-add:disabled{opacity:.35;cursor:not-allowed;}
.btn-remove{width:100%;padding:12px;border:2px solid var(--bright-pink);border-radius:30px;background:transparent;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--bright-pink);margin-top:6px;}
.btn-secondary{width:100%;padding:12px;border:2px solid rgba(0,72,55,.15);border-radius:30px;background:transparent;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--dark-green);opacity:.4;margin-top:6px;}
.btn-reward{background:var(--bright-pink);color:var(--white);border:none;}

.customer-item{background:rgba(255,255,255,.05);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s;margin-bottom:8px;}
.customer-item:hover{background:rgba(255,255,255,.1);}
.ci-left{}
.ci-name{font-size:15px;font-weight:600;}
.ci-id{font-size:10px;opacity:.35;}
.ci-meta{display:flex;align-items:center;gap:8px;}
.ci-visits{background:var(--bright-green);color:var(--dark-green);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;}
.ci-rewards{font-size:12px;opacity:.6;}

.analytics-card{background:rgba(255,255,255,.05);border-radius:18px;padding:22px 18px;}
.analytics-card h3{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.a-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.a-box{background:rgba(255,255,255,.08);border-radius:14px;padding:16px 14px;text-align:center;}
.a-box .a-num{font-size:28px;font-weight:700;color:var(--bright-green);}
.a-box .a-label{font-size:11px;opacity:.5;margin-top:2px;}
.a-box.wide{grid-column:1/-1;}

.popular-rewards{margin-top:14px;}
.popular-rewards h4{font-size:13px;font-weight:600;opacity:.7;margin-bottom:10px;}
.pr-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pr-bar-bg{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;}
.pr-bar-fill{height:100%;border-radius:6px;transition:width .5s;}
.pr-label{font-size:12px;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-count{font-size:12px;font-weight:700;width:24px;text-align:right;}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:14px 28px;border-radius:14px;font-size:14px;font-weight:600;color:var(--dark-green);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.success{background:var(--bright-green);}
.toast.error{background:var(--bright-pink);}
.toast.warning{background:var(--light-yellow);}

.pin-overlay{position:fixed;inset:0;background:var(--dark-green);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;padding:30px;text-align:center;}
.pin-overlay.hidden{display:none;}
.pin-overlay .p-logo{font-size:40px;margin-bottom:8px;}
.pin-overlay h2{font-size:22px;font-weight:700;margin-bottom:4px;}
.pin-overlay h2 span{color:var(--bright-green);}
.pin-overlay p{font-size:13px;opacity:.55;margin-bottom:22px;}
.pin-overlay input{width:200px;padding:14px;border:2px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.06);color:var(--white);font-family:inherit;font-size:22px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:16px;}
.pin-overlay button{background:var(--bright-green);color:var(--dark-green);border:none;padding:14px 48px;border-radius:30px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.pin-overlay .pin-note{font-size:11px;opacity:.4;margin-top:18px;max-width:260px;}

.empty-msg{text-align:center;opacity:.35;padding:36px 0;font-size:13px;}

@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<!-- ===== PIN ===== -->
<div class="pin-overlay" id="pin-overlay">
  <div class="p-logo">🔒</div>
  <h2><span>GlowCard</span> Admin</h2>
  <p>Enter your 4-digit PIN</p>
  <input type="password" id="pinInput" maxlength="4" placeholder="····" inputmode="numeric" autocomplete="off">
  <button onclick="checkPin()">Unlock</button>
  <p class="pin-note" id="pin-note">First time? Choose a PIN you'll remember. It will be saved for next time.</p>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="logo">💈</div>
  <h1><span>GlowCard</span> Admin</h1>
  <p>Manage visits, rewards & customers</p>
</div>

<div class="main">

  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchTab('scan')">📷 Scan</button>
    <button class="mode-tab" onclick="switchTab('manual')">✏️ Manual</button>
    <button class="mode-tab" onclick="switchTab('list')">👥 Clients</button>
    <button class="mode-tab" onclick="switchTab('analytics')">📊 Stats</button>
  </div>

  <!-- ── SCAN ── -->
  <div class="panel active" id="panel-scan">
    <video id="scanner-video" autoplay playsinline></video>
    <div class="scan-status" id="scan-status">
      <div class="icon">📷</div>
      <div class="msg">Point your camera at the customer's QR code</div>
    </div>
    <div class="found-card" id="scan-found"></div>
  </div>

  <!-- ── MANUAL ── -->
  <div class="panel" id="panel-manual">
    <div class="manual-card">
      <label>Customer ID or Name</label>
      <input type="text" id="manual-id" placeholder="e.g. GC-M1X2Y3-AB4C or 'Sarah'" autocomplete="off">
      <button class="btn-add" onclick="manualLookup()">Look Up</button>
    </div>
    <div class="found-card" id="manual-found"></div>
  </div>

  <!-- ── CLIENTS ── -->
  <div class="panel" id="panel-list">
    <div id="customer-list"></div>
  </div>

  <!-- ── ANALYTICS ── -->
  <div class="panel" id="panel-analytics">
    <div class="analytics-card" id="analytics-content"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const TOTAL=3;

const REWARDS=[
  {id:'r1',icon:'💆‍♀️',title:'Free Keratin Treatment',desc:'A full keratin smoothing treatment — on the house'},
  {id:'r2',icon:'✨',title:'Free Braids',desc:'Complimentary braiding session — any style you like'},
  {id:'r3',icon:'🧴',title:'Product Gift',desc:'Pick a free hair care product to take home'},
  {id:'r4',icon:'💧',title:'Free Deep Conditioning',desc:'Premium deep conditioning treatment for healthy hair'},
  {id:'r5',icon:'🎁',title:'Surprise!',desc:'A mystery reward — let us surprise you!'}
];

let scanning=false,lastScannedId='',lastScanTime=0;

/* ═══ DATABASE ═══ */
function getDB(){const r=localStorage.getItem('loyalty_db');return r?JSON.parse(r):{customers:{}};}
function saveDB(db){localStorage.setItem('loyalty_db',JSON.stringify(db));}
function getCustomer(id){return getDB().customers[id]||null;}
function saveCustomer(c){const db=getDB();db.customers[c.id]=c;saveDB(db);updateLeaderboard(c);}

function updateLeaderboard(c){
  const lb=JSON.parse(localStorage.getItem('glowcard_leaderboard')||'{}');
  lb[c.id]={name:c.name,visits:c.visits,totalRewards:c.totalRewards,lastActive:Date.now()};
  localStorage.setItem('glowcard_leaderboard',JSON.stringify(lb));
}

/* ═══ PIN ═══ */
function checkPin(){
  const pin=document.getElementById('pinInput').value.trim();
  if(pin.length<4)return;
  const stored=localStorage.getItem('admin_pin');
  if(!stored){localStorage.setItem('admin_pin',pin);unlock();}
  else if(pin===stored){unlock();}
  else{toast('Wrong PIN','error');document.getElementById('pinInput').value='';}
}
function unlock(){document.getElementById('pin-overlay').classList.add('hidden');initScanner();}

window.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem('admin_pin'))document.getElementById('pin-note').style.display='none';
  document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPin();});
});

/* ═══ TABS ═══ */
function switchTab(t){
  const tabs=['scan','manual','list','analytics'];
  document.querySelectorAll('.mode-tab').forEach((b,i)=>b.classList.toggle('active',tabs[i]===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  if(t==='scan')startScanner(); else stopScanner();
  if(t==='list')renderList();
  if(t==='analytics')renderAnalytics();
}

/* ═══ SCANNER ═══ */
function initScanner(){startScanner();}
function startScanner(){
  if(scanning)return;
  const v=document.getElementById('scanner-video');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(stream=>{v.srcObject=stream;scanning=true;requestAnimationFrame(scanLoop);})
    .catch(()=>{document.getElementById('scan-status').innerHTML='<div class="icon">⚠️</div><div class="msg">Camera denied — use Manual tab instead</div>';});
}
function stopScanner(){
  scanning=false;
  const v=document.getElementById('scanner-video');
  if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
}

let barcodeDetector=null;
if('BarcodeDetector' in window)barcodeDetector=new BarcodeDetector({formats:['qr_code']});

async function scanLoop(){
  if(!scanning)return;
  const v=document.getElementById('scanner-video');
  if(barcodeDetector&&v.readyState>=2){
    try{const codes=await barcodeDetector.detect(v);if(codes.length>0)handleScan(codes[0].rawValue);}catch(e){}
  }
  requestAnimationFrame(scanLoop);
}

function handleScan(raw){
  if(raw===lastScannedId&&(Date.now()-lastScanTime)<5000)return;
  try{
    const data=JSON.parse(raw);
    if(!data.id||!data.token){toast('Invalid QR','error');return;}
    const epoch30=Math.floor(Date.now()/30000);
    const valid=[btoa(data.id+'|'+epoch30),btoa(data.id+'|'+(epoch30-1))];
    if(!valid.includes(data.token)){toast('QR expired — ask customer to refresh','warning');return;}
    lastScannedId=raw;lastScanTime=Date.now();
    let customer=getCustomer(data.id);
    if(!customer)customer={id:data.id,name:data.name,visits:0,totalRewards:0,rewardHistory:[]};
    showFoundCard('scan-found',customer);
  }catch(e){toast('Could not read QR','error');}
}

/* ═══ MANUAL LOOKUP ═══ */
function manualLookup(){
  const q=document.getElementById('manual-id').value.trim();
  if(!q)return;
  const db=getDB();
  let customer=db.customers[q.toUpperCase()]||null;
  if(!customer){
    const lower=q.toLowerCase();
    customer=Object.values(db.customers).find(c=>c.name.toLowerCase().includes(lower))||null;
  }
  if(!customer){toast('Customer not found','error');return;}
  showFoundCard('manual-found',customer);
}

/* ═══ FOUND CARD ═══ */
function showFoundCard(containerId,customer){
  const el=document.getElementById(containerId);
  const left=Math.max(0,TOTAL-customer.visits);
  const full=customer.visits>=TOTAL;

  let stamps='';
  for(let i=1;i<=TOTAL;i++){
    const isFilled=i<=customer.visits;
    const isLast=i===TOTAL;
    const cls='mini-stamp'+(isFilled?' filled':'')+(isLast?' reward-slot':'');
    const icon=isFilled?'✂️':(isLast?'🎁':'💈');
    stamps+=`<div class="${cls}">${icon}</div>`;
  }

  // Check if customer has chosen a reward (from customer app)
  let rewardHTML='';
  const custApp=localStorage.getItem('loyalty_customer');
  if(custApp){
    const ca=JSON.parse(custApp);
    if(ca.id===customer.id&&ca.rewardHistory&&ca.rewardHistory.length>0){
      const latest=ca.rewardHistory[0];
      rewardHTML=`<div class="chosen-reward"><div class="cr-icon">${latest.icon}</div><div><div class="cr-title">Chose: ${latest.reward}</div><div class="cr-desc">Customer selected this reward</div></div></div>`;
    }
  }

  // Recent reward history
  let historyHTML='';
  if(customer.rewardHistory&&customer.rewardHistory.length>0){
    const recent=customer.rewardHistory.slice(0,3);
    historyHTML='<div style="margin-top:12px;text-align:left;font-size:12px;opacity:.5;font-weight:600;">Recent rewards:</div>';
    recent.forEach(h=>{historyHTML+=`<div style="font-size:12px;opacity:.45;padding:4px 0;">${h.icon} ${h.reward} — ${h.date}</div>`;});
  }

  el.innerHTML=`
    <div class="found-name">${customer.name} 💈</div>
    <div class="found-id">${customer.id}</div>
    <div class="found-visits">
      <div class="fv-box"><div class="num">${customer.visits}</div><div class="lbl">Visits</div></div>
      <div class="fv-box"><div class="num">${left}</div><div class="lbl">Left</div></div>
      <div class="fv-box"><div class="num">${customer.totalRewards}</div><div class="lbl">Rewards</div></div>
    </div>
    <div class="stamp-row">${stamps}</div>
    ${rewardHTML}
    ${full
      ?`<button class="btn-add btn-reward" onclick="grantReward('${customer.id}','${containerId}')">🎉 Grant Reward & Reset</button>`
      :`<button class="btn-add" onclick="addVisit('${customer.id}','${containerId}')">+ Add Visit</button>`
    }
    <button class="btn-remove" onclick="removeVisit('${customer.id}','${containerId}')">− Remove Last Visit</button>
    <button class="btn-secondary" onclick="resetCard('${customer.id}','${containerId}')">Reset Card to 0</button>
    ${historyHTML}
  `;
  el.classList.add('show');
}

/* ═══ ACTIONS ═══ */
function addVisit(id,container){
  let c=getCustomer(id);if(!c)return;
  if(c.visits>=TOTAL){toast('Card full — grant reward first','warning');return;}
  c.visits++;
  saveCustomer(c);showFoundCard(container,c);
  toast(`✂️ Visit ${c.visits} added for ${c.name}!`,'success');
  syncToCustomerApp(c);
}
function removeVisit(id,container){
  let c=getCustomer(id);if(!c||c.visits<=0){toast('No visits to remove','warning');return;}
  c.visits--;saveCustomer(c);showFoundCard(container,c);toast('Visit removed','error');syncToCustomerApp(c);
}
function grantReward(id,container){
  let c=getCustomer(id);if(!c)return;

  let rewardTitle='Reward';let rewardIcon='🎁';
  const custApp=localStorage.getItem('loyalty_customer');
  if(custApp){
    const ca=JSON.parse(custApp);
    if(ca.id===c.id&&ca.rewardHistory&&ca.rewardHistory.length>0){
      rewardTitle=ca.rewardHistory[0].reward;
      rewardIcon=ca.rewardHistory[0].icon;
    }
  }
  if(!c.rewardHistory)c.rewardHistory=[];

  c.visits=0;c.totalRewards++;
  c.rewardHistory.unshift({reward:rewardTitle,icon:rewardIcon,date:new Date().toLocaleDateString()});
  saveCustomer(c);showFoundCard(container,c);
  toast(`🎉 Reward granted to ${c.name}!`,'success');
  syncToCustomerApp(c);
}
function resetCard(id,container){
  if(!confirm('Reset this card to 0 visits?'))return;
  let c=getCustomer(id);if(!c)return;
  c.visits=0;saveCustomer(c);showFoundCard(container,c);toast('Card reset','warning');syncToCustomerApp(c);
}

function syncToCustomerApp(c){
  const raw=localStorage.getItem('loyalty_customer');
  if(raw){const ex=JSON.parse(raw);if(ex.id===c.id){ex.visits=c.visits;ex.totalRewards=c.totalRewards;localStorage.setItem('loyalty_customer',JSON.stringify(ex));}}
}

/* ═══ CUSTOMER LIST ═══ */
function renderList(){
  const db=getDB();const list=Object.values(db.customers);
  const el=document.getElementById('customer-list');
  if(list.length===0){el.innerHTML='<div class="empty-msg">No customers yet.<br>Scan a QR to add the first one! 💈</div>';return;}

  list.sort((a,b)=>(b.totalRewards-a.totalRewards)||(b.visits-a.visits));

  el.innerHTML=list.map(c=>`
    <div class="customer-item" onclick="switchTab('manual');document.getElementById('manual-id').value='${c.id}';manualLookup();">
      <div class="ci-left">
        <div class="ci-name">${c.name}</div>
        <div class="ci-id">${c.id}</div>
      </div>
      <div class="ci-meta">
        <span class="ci-rewards">${c.totalRewards}🎁</span>
        <span class="ci-visits">${c.visits} / ${TOTAL}</span>
      </div>
    </div>`).join('');
}

/* ═══ ANALYTICS ═══ */
function renderAnalytics(){
  const db=getDB();const list=Object.values(db.customers);
  const el=document.getElementById('analytics-content');

  const totalCustomers=list.length;
  const totalVisitsAll=list.reduce((s,c)=>s+c.visits+(c.totalRewards||0)*TOTAL,0);
  const totalRewardsAll=list.reduce((s,c)=>s+(c.totalRewards||0),0);
  const activeNow=list.filter(c=>c.visits>0).length;
  const avgVisits=totalCustomers?((list.reduce((s,c)=>s+c.visits,0))/totalCustomers).toFixed(1):'0';
  const fullCards=list.filter(c=>c.visits>=TOTAL).length;

  const rewardCounts={};
  list.forEach(c=>{
    if(c.rewardHistory){
      c.rewardHistory.forEach(h=>{rewardCounts[h.reward]=(rewardCounts[h.reward]||0)+1;});
    }
  });
  const rewardsSorted=Object.entries(rewardCounts).sort((a,b)=>b[1]-a[1]);
  const maxRewardCount=rewardsSorted.length>0?rewardsSorted[0][1]:1;

  const colors=['var(--bright-green)','var(--c5)','var(--c2)','var(--bright-pink)','var(--c7)'];

  let rewardsHTML='';
  if(rewardsSorted.length>0){
    rewardsHTML=`<div class="popular-rewards"><h4>🎁 Most Popular Rewards</h4>${rewardsSorted.map((r,i)=>{
      const pct=Math.round((r[1]/maxRewardCount)*100);
      return `<div class="pr-row"><span class="pr-label">${r[0]}</span><div class="pr-bar-bg"><div class="pr-bar-fill" style="width:${pct}%;background:${colors[i%colors.length]}"></div></div><span class="pr-count">${r[1]}</span></div>`;
    }).join('')}</div>`;
  }

  el.innerHTML=`
    <h3>📊 GlowCard Analytics</h3>
    <div class="a-grid">
      <div class="a-box"><div class="a-num">${totalCustomers}</div><div class="a-label">Total Clients</div></div>
      <div class="a-box"><div class="a-num">${activeNow}</div><div class="a-label">Active Cards</div></div>
      <div class="a-box"><div class="a-num">${totalRewardsAll}</div><div class="a-label">Rewards Given</div></div>
      <div class="a-box"><div class="a-num">${fullCards}</div><div class="a-label">Ready to Claim</div></div>
      <div class="a-box"><div class="a-num">${avgVisits}</div><div class="a-label">Avg Visits / Client</div></div>
      <div class="a-box"><div class="a-num">${totalVisitsAll}</div><div class="a-label">Total Visits Ever</div></div>
    </div>
    ${rewardsHTML}
  `;
}

/* ═══ TOAST ═══ */
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type+' show';
  setTimeout(()=>el.classList.remove('show'),2500);
}
</script>
